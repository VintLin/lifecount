<!doctype html><meta charset="utf-8"><style>body{font-family:var(--font-sans,system-ui);color:var(--foreground)}nav{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}button{border:1px solid var(--border);background:var(--secondary);color:var(--foreground);padding:8px 14px;border-radius:var(--radius,8px);cursor:pointer}button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}img{display:none;width:100%;border-radius:var(--radius,8px)}img.active{display:block}</style><nav><button aria-pressed="true" onclick="show(0)">清晨 · 27%</button><button aria-pressed="false" onclick="show(1)">正午 · 50%</button><button aria-pressed="false" onclick="show(2)">日落 · 74%</button><button aria-pressed="false" onclick="show(3)">夜空 · 95%</button></nav><img class="active" src="/Users/Vint/Repos/01_Project_Personal/011_LifeCount/docs/e2e/daylight/dawn.png" alt="dawn"><img class="" src="/Users/Vint/Repos/01_Project_Personal/011_LifeCount/docs/e2e/daylight/noon.png" alt="noon"><img class="" src="/Users/Vint/Repos/01_Project_Personal/011_LifeCount/docs/e2e/daylight/sunset.png" alt="sunset"><img class="" src="/Users/Vint/Repos/01_Project_Personal/011_LifeCount/docs/e2e/daylight/night.png" alt="night"><script>function show(i){document.querySelectorAll('img').forEach((e,n)=>e.classList.toggle('active',n===i));document.querySelectorAll('button').forEach((e,n)=>e.setAttribute('aria-pressed',n===i))}</script>
