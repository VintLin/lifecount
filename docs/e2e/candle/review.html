<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:var(--font-sans);color:var(--foreground)}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}button{font:inherit;font-size:14px;border:0;border-radius:12px;padding:8px 14px;background:var(--secondary);color:var(--foreground);cursor:pointer}button[aria-pressed=true]{background:var(--foreground);color:var(--background)}img{width:100%;display:block;border-radius:var(--radius)}</style><nav aria-label="验收截图"><button aria-pressed="true" data-image="current-life">当前设置</button><button aria-pressed="false" data-image="newborn">出生</button><button aria-pressed="false" data-image="terminal">燃尽</button><button aria-pressed="false" data-image="fullscreen">全屏</button></nav><img id="view" alt="实际页面验收截图" src="/Users/Vint/Repos/01_Project_Personal/011_LifeCount/docs/e2e/candle/current-life.png"><div hidden><img data-state="newborn" src="/Users/Vint/Repos/01_Project_Personal/011_LifeCount/docs/e2e/candle/newborn.png"><img data-state="terminal" src="/Users/Vint/Repos/01_Project_Personal/011_LifeCount/docs/e2e/candle/terminal.png"><img data-state="fullscreen" src="/Users/Vint/Repos/01_Project_Personal/011_LifeCount/docs/e2e/candle/fullscreen.png"></div><script>const images={'current-life':document.querySelector('#view').src};document.querySelectorAll('[data-state]').forEach(i=>images[i.dataset.state]=i.src);document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelector('#view').src=images[b.dataset.image];document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))})</script></html>
