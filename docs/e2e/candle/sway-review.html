/** Baked 3D geometry indexed by actual life progress; playback never advances age. */
function createCandle(canvas, baseUrl, status) {
    const ctx = canvas.getContext('2d');
    if (!ctx)
        throw new Error('Canvas 2D unavailable');
    const buffer = document.createElement('canvas');
    buffer.width = buffer.height = 1;
    const source = buffer.getContext('2d', { willReadFrequently: true });
    const flameLayer = document.createElement('canvas');
    let flameBox = null;
    // Separate only the warm emissive pixels above the wick, never the wax or dark wick.
    function separateFlame() {
        flameBox = null;
        const p = renderedProgress;
        if (p >= 1)
            return;
        const size = buffer.width, scale = 4.55 - 1.05 * p + .30 * Math.max(0, 1 - p / .08) ** 2;
        const wick = Math.max(.105, 3.5 * (1 - p) ** 1.06 - .10), strength = Math.min(1, (1 - p) / .10);
        const root = (.5 - (wick + .20 - (1.65 - .43 * p)) * .943 / scale) * size;
        const x = Math.floor(size * (.5 - .14 / scale));
        const y = Math.max(0, Math.floor(root - (.48 * strength * .943 + .025) / scale * size));
        const w = Math.ceil(size * .28 / scale), h = Math.ceil(root + .015 / scale * size - y);
        const pixels = source.getImageData(x, y, w, h);
        flameLayer.width = w;
        flameLayer.height = h;
        const fc = flameLayer.getContext('2d'), flame = fc.createImageData(w, h);
        for (let i = 0; i < pixels.data.length; i += 4) {
            const r = pixels.data[i], g = pixels.data[i + 1], b = pixels.data[i + 2];
            if (r > 180 && r - g > 3 && r - b > 7) {
                flame.data.set(pixels.data.subarray(i, i + 4), i);
                pixels.data[i] = pixels.data[i + 1] = pixels.data[i + 2] = 255;
            }
        }

        fc.putImageData(flame, 0, 0);
        flameBox = { x, y, root };
    }

    let disposed = false, suspended = false, flowing = false, progress = 0, revision = 0;
    let animation = 0, lastTime = 0, ready = false, failed = false, frameKey = "";
    let width = 0, height = 0, side = 0, left = 0, top = 0, renderedProgress = 0;

    const frameIndex = () => progress >= 1 ? 100 : Math.min(99, Math.round(progress * 100));

                throw new Error('Obsolete candle asset');

            cache.delete(index); throw error; });

        cache.set(index, entry);
        return entry.promise;
    }

        for (const [index, entry] of cache) {
            if (cache.size <= 3)
                break;
            if (keep.includes(index))
                continue;
            entry.abort.abort();
            entry.bitmap?.close();
            cache.delete(index);
        }
    }

        if (!ctx || disposed)
            return;
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, width, height);
        if (ready) {
            side = Math.min(width, height, buffer.width);
            left = (width - side) / 2;
            top = (height - side) / 2;

                const sway = time === undefined ? 0 : .065 * Math.sin(t * 2.1) + .035 * Math.sin(t * 3.73 + .8) + .018 * Math.sin(t * 6.17);
                const stretch = time === undefined ? 1 : 1 + .025 * Math.sin(t * 2.9 + .4) + .012 * Math.sin(t * 5.3);

                ctx.restore();
            }
        }
    }
    // Only the extracted flame moves; the wick and wax remain fixed.
    function tick(time) {
        animation = 0;
        if (disposed || suspended || !flowing || !ready || progress >= 1)
            return;
        if (time - lastTime >= 1000 / 30) {
            lastTime = time;
            paint(time);
        }
        animation = requestAnimationFrame(tick);
    }
    function schedule() { if (!animation && !suspended && flowing && progress < 1 && ready)
        animation = requestAnimationFrame(tick); }

        if (failed || disposed)
            return;
        const token = ++revision, index = frameIndex();
        stop();
        if (!cache.get(index)?.bitmap) {
            ready = false;
            paint();
            status('loading');
        }
        try {
            const bitmap = await load(index);
            if (disposed || token !== revision)
                return;
            trim([index]);
            // Draw one native-resolution frame; alpha blends create doubled wax edges.
            buffer.width = bitmap.width;
            buffer.height = bitmap.height;
            source.drawImage(bitmap, 0, 0);
            renderedProgress = index / 100;
            separateFlame();
            ready = true;
            canvas.dataset.progress = String(progress);
            canvas.dataset.frame = String(index);
            status('ready');
            paint();
            schedule();
        }
        catch {
            if (!disposed && token === revision) {
                ready = false;
                failed = true;
                paint();
                status('error');
            }
        }
    }
    const resize = () => {
        const rect = canvas.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
        width = Math.max(1, Math.round(rect.width * dpr));
        height = Math.max(1, Math.round(rect.height * dpr));
        canvas.width = width;
        canvas.height = height;
        side = Math.min(width, height);
        left = (width - side) / 2;
        top = (height - side) / 2;
        paint();
    };
    const observer = new ResizeObserver(resize);
    observer.observe(canvas);
    resize();
    return {
        update(value, active) {
            progress = Math.max(0, Math.min(1, Number.isFinite(value) ? value : 0));
            flowing = active;
            const key = String(frameIndex());
            canvas.dataset.progress = String(progress);
            if (key === frameKey && ready) {
                if (!flowing) {
                    stop();
                    paint();
                }
                else
                    schedule();
                return;
            }
            if (key !== frameKey) {
                failed = false;
                frameKey = key;
            }
            void refresh();
        },
        suspend(value) { suspended = value; if (value) {
            stop();
            paint();
        }
        else
            schedule(); },
        retry() { failed = false; void refresh(); },
        destroy() {
            disposed = true;
            ++revision;
            stop();
            observer.disconnect();
            for (const entry of cache.values()) {
                entry.abort.abort();
                entry.bitmap?.close();
            }
            cache.clear();
            buffer.width = buffer.height = 0;
            flameLayer.width = flameLayer.height = 0;
            flameBox = null;
            delete canvas.dataset.progress;
            delete canvas.dataset.frame;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    };
}

const c=document.querySelector('canvas'),ctx=c.getContext('2d');let ready;const r=createCandle(c,'/',s=>{document.body.dataset.status=s;if(s==='ready')ready?.();if(s==='error')throw Error('asset error')});
const step=()=>new Promise(r=>setTimeout(r,350));
const read=()=>ctx.getImageData(0,0,c.width,c.height).data;
const load=p=>new Promise(resolve=>{ready=resolve;r.update(p,true)});
(async()=>{let clock=0;const results=[];for(const p of [0,.77,.99,1]){
 await load(p);clock+=2000;await step();const a=read();await step();const b=read();let count=0,minY=c.height,maxY=0;
 for(let i=0;i<a.length;i+=4)if(a[i]!==b[i]||a[i+1]!==b[i+1]||a[i+2]!==b[i+2]){count++;minY=Math.min(minY,Math.floor(i/4/c.width));maxY=Math.max(maxY,Math.floor(i/4/c.width))}
 r.suspend(true);const paused=read();await step();const readPaused=read();const pausedStable=paused.every((v,i)=>v===readPaused[i]);if(!pausedStable)throw Error("Pause unstable");
 results.push({progress:p,movedPixels:count,minY,maxY,pass:p===1?count===0:count>0});r.suspend(false);
 }
 document.body.dataset.results=JSON.stringify(results);console.log('SWAY_ACCEPTANCE '+JSON.stringify(results));if(results.some(v=>!v.pass))throw Error('Sway acceptance failed');
 await load(.77);r.suspend(true);r.suspend(false);
 let paused=false;document.querySelector('button').onclick=()=>{paused=!paused;r.suspend(paused);document.querySelector('button').textContent=paused?'继续摇曳':'暂停摇曳'};
})().catch(e=>{document.body.dataset.error=e.message;console.error(e.message)});
