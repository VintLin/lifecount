/** Baked 3D geometry indexed by actual life progress; playback never advances age. */
function createCandle(canvas, baseUrl, status) {
    const ctx = canvas.getContext('2d');
    if (!ctx)
        throw new Error('Canvas 2D unavailable');
    const buffer = document.createElement('canvas');
    buffer.width = buffer.height = 1;
    const source = buffer.getContext('2d', { willReadFrequently: true });
    const flameLayer = document.createElement('canvas');
    let flameBox = null;
    // Separate only the warm emissive pixels above the wick, never the wax or dark wick.
    function separateFlame() {
        flameBox = null;
        const p = renderedProgress;
        if (p >= 1)
            return;
        const size = buffer.width, scale = 4.55 - 1.05 * p + .30 * Math.max(0, 1 - p / .08) ** 2;
        const wick = Math.max(.105, 3.5 * (1 - p) ** 1.06 - .10), strength = Math.min(1, (1 - p) / .10);
        const root = (.5 - (wick + .13 - (1.65 - .43 * p)) * .943 / scale) * size;
        const x = Math.floor(size * (.5 - .14 / scale));
        const y = Math.max(0, Math.floor(root - (.48 * strength * .943 + .025) / scale * size));
        const w = Math.ceil(size * .28 / scale), h = Math.ceil(root + .015 / scale * size - y);
        const pixels = source.getImageData(x, y, w, h);
        flameLayer.width = w;
        flameLayer.height = h;
        const fc = flameLayer.getContext('2d'), flame = fc.createImageData(w, h);
        for (let i = 0; i < pixels.data.length; i += 4) {
            const r = pixels.data[i], g = pixels.data[i + 1], b = pixels.data[i + 2];
            // Match the rendered flame envelope so nearby ivory wax cannot enter the moving layer.
            const row = Math.floor(i / 4 / w), column = (i / 4) % w;
            const t = (root - y - row) / (size * .48 * strength * .943 / scale);
            const radius = Math.max(...[t - .06, t, t + .06].map(v => {
                const u = Math.max(0, Math.min(1, v));
                return .085 * Math.sin(Math.PI * u) ** .72 * (1 - .6 * u) * strength;
            })) * size / scale + 2;
            const centre = size / 2 + .035 * Math.max(0, t) ** 2 * Math.sin(p * 25) * size / scale;

        }
    }

    function tick(time) {

        if (disposed || suspended || !flowing || !ready || progress >= 1)
            return;
        if (time - lastTime >= 1000 / 30) {
            lastTime = time;
            paint(time);
        }
        animation = requestAnimationFrame(tick);
    }
    function schedule() { if (!animation && !suspended && flowing && progress < 1 && ready)
        animation = requestAnimationFrame(tick); }
    async function refresh() {
        if (failed || disposed)
            return;
        const token = ++revision, index = frameIndex();
        stop();
        if (!cache.get(index)?.bitmap) {
            ready = false;
            paint();
            status('loading');
        }
        try {
            const bitmap = await load(index);
            if (disposed || token !== revision)
                return;
            trim([index]);
            // Draw one native-resolution frame; alpha blends create doubled wax edges.
            buffer.width = bitmap.width;
            buffer.height = bitmap.height;
            source.drawImage(bitmap, 0, 0);
            renderedProgress = index / 100;
            separateFlame();
            ready = true;
            canvas.dataset.progress = String(progress);
            canvas.dataset.frame = String(index);
            status('ready');
            paint();
            schedule();
        }
        catch {
            if (!disposed && token === revision) {
                ready = false;
                failed = true;
                paint();
                status('error');
            }
        }
    }
    const resize = () => {
        const rect = canvas.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
        width = Math.max(1, Math.round(rect.width * dpr));
        height = Math.max(1, Math.round(rect.height * dpr));
        canvas.width = width;
        canvas.height = height;
        side = Math.min(width, height);
        left = (width - side) / 2;
        top = (height - side) / 2;
        paint();
    };
    const observer = new ResizeObserver(resize);
    observer.observe(canvas);
    resize();
    return {
        update(value, active) {
            progress = Math.max(0, Math.min(1, Number.isFinite(value) ? value : 0));
            flowing = active;
            const key = String(frameIndex());
            canvas.dataset.progress = String(progress);
            if (key === frameKey && ready) {
                if (!flowing) {
                    stop();
                    paint();
                }
                else
                    schedule();
                return;
            }
            if (key !== frameKey) {
                failed = false;
                frameKey = key;
            }
            void refresh();
        },
        suspend(value) { suspended = value; if (value) {
            stop();
            paint();
        }
        else
            schedule(); },
        retry() { failed = false; void refresh(); },
        destroy() {
            disposed = true;
            ++revision;
            stop();
            observer.disconnect();
            for (const entry of cache.values()) {
                entry.abort.abort();
                entry.bitmap?.close();
            }
            cache.clear();
            buffer.width = buffer.height = 0;
            flameLayer.width = flameLayer.height = 0;
            flameBox = null;
            delete canvas.dataset.progress;
            delete canvas.dataset.frame;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    };
}

const read=()=>ctx.getImageData(0,0,c.width,c.height).data;
const load=p=>new Promise(resolve=>{ready=resolve;r.update(p,true)});
(async()=>{let clock=0;const results=[];for(const p of [0,.38,.77,.99,1]){
 await load(p);clock+=2000;await step();const a=read();await step();const b=read();let count=0,minY=c.height,maxY=0;
 for(let i=0;i<a.length;i+=4)if(a[i]!==b[i]||a[i+1]!==b[i+1]||a[i+2]!==b[i+2]){count++;minY=Math.min(minY,Math.floor(i/4/c.width));maxY=Math.max(maxY,Math.floor(i/4/c.width))}
